# ─────────────────────────────────────────────────────────────
# Writer 生产部署编排
# 架构：nginx(公网) → executor(7788 /api) + evolution(7789 /evolution-api) + website(80 官网&下载)
# 桌面化改造（2026-07-07）：evolution 从"仅 loopback + SSH 隧道"改为 nginx 反代 + SSO 鉴权
# ─────────────────────────────────────────────────────────────
# 启动：docker compose up -d
# 升级：git checkout <tag> && docker compose build && docker compose up -d
# 回滚：git checkout <上个 tag> && docker compose build && docker compose up -d
#
# 桌面端改造（S7/S9/S12）：
#   - 移除原 frontend 容器（Next.js，已废弃，UI 迁入 desktop/）
#   - 新增 website 容器（Astro 静态官网 + 下载页）
#   - nginx: /api/* → executor, /download/* → 静态发布目录, / → website
# ─────────────────────────────────────────────────────────────

services:
  # ── 写作 Agent 执行端（用户用，有鉴权）──
  executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
    container_name: writer-executor
    env_file:
      - executor/.env
    environment:
      # 容器内 evolution 通知地址（用 docker 服务名，非 localhost）
      - EVOLUTION_NOTIFY_URL=http://evolution:7789/api/ingestion/notify
      - EVOLUTION_URL=http://evolution:7789
      # 平台控制面（REQ-20260919-202344 Phase A）：artifact 拉取 / Run 绑定 / resume 门禁
      - PLATFORM_URL=http://platform:7790
      # working harness 包（A/B 无 commit 时的本地直读源；生产版本走 Platform artifact）
      - HARNESS_PACKAGE_PATH=/app/evolution/harnesses/repo
      - TZ=Asia/Shanghai
      # 数据目录指向 volume 挂载点（源码不挂卷，根治旧方案源码被覆盖问题）
      - DB_PATH=/app/executor/data/app.platform.core.db
      - WORKSPACE_ROOT=/app/executor/data/workspace
      # artifact 缓存与绑定 spool 落 executor_data 卷（重建容器不重下）
      - ARTIFACT_CACHE_DIR=/app/executor/data/artifact_cache
      - BINDING_SPOOL_DIR=/app/executor/data/binding_spool
      - KNOWN_PRODUCTION_PATH=/app/executor/data/known_production.json
      # 桌面化改造（2026-07-07）：内网通知 token，与 evolution NOTIFY_TOKEN 一致。
      # 部署时在 executor/.env 里设 EVOLUTION_NOTIFY_TOKEN=<同 evolution 的 NOTIFY_TOKEN>。
      # - EVOLUTION_NOTIFY_TOKEN=<强随机 token>
      # 积分制（2026-07-09）：平台代付 key + base_url（优先于 OPENAI_API_KEY）
      - PLATFORM_API_KEY=${PLATFORM_API_KEY:-}
      - PLATFORM_BASE_URL=${PLATFORM_BASE_URL:-}
      # 记忆系统（NWM 重构，2026-07-17）：去 Graphiti/FalkorDB，改 SQLite + sqlite-vec。
      # 配置项（MEMORY_EXTRACT_*/MEMORY_EMBED_*）走 executor/.env，不在此硬编码。
      # memory.db 落在 executor_data 卷内（DB_PATH 同目录的 memory/ 子目录）。
      # 基建指标埋点（REQ-20260918-144856）：OTLP 推送 collector；SEMCONV 固定
      # 新语义约定（http.server.request.duration + http.response.status_code）。
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SEMCONV_STABILITY_OPT_IN=http
    volumes:
      # 持久化：用户库 + workspace + checkpoints（用户数据，不可丢）
      # 源码不挂卷——留在镜像里，rebuild 自动更新（根治旧方案源码被 volume 覆盖的问题）。
      # db_path/workspace_root/checkpoints 都指向 data/ 子目录。
      - executor_data:/app/executor/data
      # 共享 harness 包（evolution 编辑 → executor 同进程 import）
      - harness_data:/app/evolution/harnesses
      # 共享 harness bare repo（evolution push → executor pull）
      - harness_git:/app/evolution/harness.git
    expose:
      - "7788"
    restart: always
    # 安全加固：禁止容器内进程通过 setuid 等提权
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7788/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── 平台控制面（REQ-20260919-202344 Phase A）──
  # 版本账本 / 发版门禁（子进程真实装配候选）/ artifact 打包分发 / Run 绑定 / resume 兼容判定。
  # 内网信任域：不经 nginx 暴露，只被 executor 与 evolution 经 docker 网络访问。
  platform:
    build:
      context: .
      dockerfile: Dockerfile.platform
    container_name: writer-platform
    environment:
      - TZ=Asia/Shanghai
      # 容器内服务地址（docker 服务名）
      - PLATFORM_EXECUTOR_URL=http://executor:7788
      # harness bare repo（evolution push → platform checkout 门禁/打包）
      - PLATFORM_BARE_REPO=/app/evolution/harness.git
      # 账本与 artifact 落 platform_data 卷（版本历史不可丢）
      - PLATFORM_DB_PATH=/app/platform/data/platform.db
      - PLATFORM_ARTIFACT_DIR=/app/platform/data/artifacts
    volumes:
      - platform_data:/app/platform/data
      # bare repo 只读：platform 只 clone 读，push 方仍是 evolution
      - harness_git:/app/evolution/harness.git:ro
    expose:
      - "7790"
    restart: always
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7790/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── 进化/监测后端（桌面化改造，2026-07-07：挂公网，nginx 反代 + SSO 鉴权）──
  evolution:
    build:
      context: .
      dockerfile: Dockerfile.evolution
    container_name: writer-evolution
    env_file:
      - evolution/.env
    environment:
      # 容器内 executor 地址（用 docker 服务名）：trace 拉取 + SSO 回调 /api/auth/me
      - EXECUTOR_URL=http://executor:7788
      # 平台控制面（Phase A）：发版门禁 probe 与晋升 promote 改调 Platform
      - PLATFORM_URL=http://platform:7790
      - TZ=Asia/Shanghai
      # 数据库路径指向 volume（data/evolution.db），否则默认 evolution.db 解析到
      # 工作目录（非 volume），每次重建镜像就丢 llm_configs 等数据。
      - EVOLUTION_DB=data/evolution.db
      # V1 legacy 兼容：旧评估提取器仍需只读 workspace；Trace V2 卷宗只从
      # ArtifactRevision 和受治理 Payload 读取，绝不从可变 workspace 补造历史。
      - EXECUTOR_WORKSPACE=/app/executor/data/workspace
      # 桌面化鉴权（2026-07-07）：SSO 白名单 + 内网通知 token + 加密主密钥。
      # 这三项是安全关键，不写在 .env（避免随源码泄露），由 compose environment 注入。
      # 部署时在 evolution/.env 里设真实值，或用 Docker secrets。
      # - ALLOWED_USER_IDS=<你的 executor user_id>
      # - NOTIFY_TOKEN=<强随机 token>
      # - EVOLUTION_MASTER_KEY=<hex 64 字符>
      # 基建指标埋点（REQ-20260918-144856）：OTLP 推送 collector；SEMCONV 固定
      # 新语义约定（http.server.request.duration + http.response.status_code）。
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SEMCONV_STABILITY_OPT_IN=http
    volumes:
      # 持久化：evolution.db（监测数据 + llm_configs 加密 key，不可丢）
      # 只挂 data/ 子目录（2026-07-08）：源码不挂卷，增量更新 build+up 即生效，
      # 避免 volume 旧源码覆盖镜像新源码。db 路径 = data/evolution.db。
      - evolution_data:/app/evolution/data
      # 共享 harness（与 executor 同一份）
      - harness_data:/app/evolution/harnesses
      - harness_git:/app/evolution/harness.git
      # 仅供 V1 legacy reader 只读兼容；V2 的不可变制品和 Payload 在 evolution_data。
      # evolution 不写 workspace（:ro），产物真源仍在 executor。
      - executor_data:/app/executor/data:ro
    # 对齐 executor 模式（expose + nginx location）。
    expose:
      - "7789"
    restart: always
    # 安全加固
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7789/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── 官网 + 下载页（Astro 静态站，nginx 托管）──
  website:
    build:
      context: .
      dockerfile: Dockerfile.website
    container_name: writer-website
    expose:
      - "80"
    restart: always
    security_opt:
      - no-new-privileges:true

  # ═══════════ 观测栈（REQ-20260918-144856，DEC-006/007/009）═══════════
  # 数据路径：executor/evolution OTel SDK --OTLP/HTTP--> otel-collector
  #           <--30s 抓取-- prometheus <--查询-- grafana(nginx /grafana 反代)
  # 内存预算（DEC-009，服务器 2核4G）：四容器合计硬顶 608M ≤ 640M 预算。
  # 业务不依赖观测栈（FR-006）：观测容器全挂不影响写作/进化。
  otel-collector:
    image: otel/opentelemetry-collector:0.104.0
    container_name: writer-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otelcol.yaml:/etc/otelcol/config.yaml:ro
    expose:
      - "4318"   # OTLP/HTTP 接收（executor/evolution 推送，仅内网）
      - "8889"   # Prometheus exporter（prometheus 抓取，仅内网）
    mem_limit: 128m
    restart: always
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: writer-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d   # DEC-009：保留 15 天
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    mem_limit: 256m
    restart: always
    security_opt:
      - no-new-privileges:true

  grafana:
    # 12.4.x = 在维护安全线（12.4.11 补丁 2026-09-15；11.x 已 EOL 且 11.1/11.6.0
    # 含 CVE-2024-9264 / CVE-2025-4123 公网利用链，review 两轮整改）。
    # 升级前核对 https://endoflife.date/grafana 的在维护线与最新补丁号。
    image: grafana/grafana:12.4.11
    container_name: writer-grafana
    environment:
      # 管理员密码：根 .env 设置 GRAFANA_ADMIN_PASSWORD（DEC-008 修订：自带登录）
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?请在项目根 .env 设置 GRAFANA_ADMIN_PASSWORD}
      # 子路径部署（nginx 反代 /grafana，DEC-008）
      - GF_SERVER_ROOT_URL=https://siyen.site/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Grafana 12 对 API POST（面板查询等）强制来源白名单校验，root_url 不再
      # 隐式放行——不配则面板全部 "origin not allowed"（部署实测 2026-09-19）。
      # 生效键为 security.csrf_trusted_origins（GF_SECURITY_CSRF_TRUSTED_ORIGINS）；
      # Live WebSocket 另走 live.allowed_origins。
      - GF_SECURITY_CSRF_TRUSTED_ORIGINS=https://siyen.site,https://www.siyen.site
      - GF_SECURITY_TRUSTED_ORIGINS=https://siyen.site,https://www.siyen.site
      - GF_LIVE_ALLOWED_ORIGINS=https://siyen.site,https://www.siyen.site
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - "3000"
    mem_limit: 192m
    restart: always
    security_opt:
      - no-new-privileges:true

  # 服务探活（FR-007 规则①）：blackbox 探 executor/evolution /health。
  # 不用 prometheus 直接抓 /health：JSON 非 Prometheus 格式会判抓取失败误报 up=0。
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: writer-blackbox
    expose:
      - "9115"
    mem_limit: 32m
    restart: always
    security_opt:
      - no-new-privileges:true

  # ── 公网入口：nginx 反代 + HTTPS ──
  nginx:
    image: nginx:alpine
    container_name: writer-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书：直接挂 letsencrypt 真实目录（宿主 certs/ 里的软链接容器内 follow 不到）
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # certbot webroot 验证（若用 certbot 容器签发）
      - ./certbot:/var/www/certbot:ro
      # 桌面端更新分发：latest.json + .msi + .sig（publish.sh 上传到此目录）
      - ./releases:/var/www/releases:ro
    depends_on:
      - executor
      - evolution
      - website
    restart: always
    # 安全加固：nginx 是唯一公网入口，最严格限制
    security_opt:
      - no-new-privileges:true
    # 只读根文件系统 + 临时写目录（nginx 需要 /var/cache /var/run /tmp）
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

volumes:
  executor_data:    # executor/.env 的 db_path / workspace_root / checkpoints / memory / artifact 缓存都在此卷内
  evolution_data:   # evolution 的 evolution.db 在此卷内
  platform_data:    # 平台控制面：版本账本 platform.db + artifact 库（REQ-20260919-202344）
  harness_data:     # evolution/harnesses/ 共享（executor working 包 + evolution 编辑）
  harness_git:      # evolution/harness.git/ 共享 bare repo（evolution push → platform checkout）
  prometheus_data:  # 观测栈：15 天指标（REQ-20260918-144856）
  grafana_data:     # 观测栈：Grafana 配置/面板状态
