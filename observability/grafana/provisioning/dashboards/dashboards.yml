# Grafana 面板提供者：从 /var/lib/grafana/dashboards 加载 JSON（REQ-20260918-144856 FR-004）
apiVersion: 1
providers:
  - name: writer
    folder: Writer
    type: file
    disableDeletion: true
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
