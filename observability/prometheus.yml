# ─────────────────────────────────────────────────────────────
# Prometheus 配置（REQ-20260918-144856 FR-002/FR-007）
# 抓取目标：
#   otel-collector:8889  —— 全部业务指标（唯一指标真源，FR-003 序列在此收敛）
#   blackbox 探针        —— executor/evolution /health 存活（FR-007 规则①数据源）。
#                           不直接抓 /health：JSON 非 Prometheus 格式会被判抓取失败。
# 保留期 15 天由 docker-compose 启动参数指定（DEC-009）。
# ─────────────────────────────────────────────────────────────
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://executor:7788/health
          - http://evolution:7789/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
